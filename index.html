<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Vault</title>
<meta name="description" content="A workbench of staff-level system design trap questions: the tempting wrong answer, what to say instead, and in-depth answers with follow-ups.">
<meta property="og:title" content="System Design Vault">
<meta property="og:description" content="Staff-level system design trap questions with in-depth answers, active recall and a trap drill.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M8 10h16M8 16h11M8 22h7' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>(function(){var t=null;try{t=localStorage.getItem("sdv-theme")}catch(e){}var d=document.documentElement;if(t==="light"||t==="dark")d.setAttribute("data-theme",t);else if(t==="auto"){d.setAttribute("data-theme",matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}else d.setAttribute("data-theme","dark")})()</script>
<style>
:root,[data-theme="dark"]{
  --bg:#0b0d10;--panel:#101318;--raised:#161a20;--hover:#1b2028;--line:#232831;--line2:#2e3540;
  --ink:#e7e9ec;--ink2:#c3c8cf;--muted:#8a929c;--faint:#5d6570;
  --accent:#818cf8;--accent-bg:rgba(129,140,248,.14);--accent-ink:#0b0d10;--cyan:#22d3ee;
  --ok:#34d399;--ok-bg:rgba(52,211,153,.13);--warn:#fbbf24;--warn-bg:rgba(251,191,36,.10);--bad:#f87171;--bad-bg:rgba(248,113,113,.12);
  --mark:rgba(251,191,36,.28);--shadow:0 16px 40px rgba(0,0,0,.45);color-scheme:dark;
}
[data-theme="light"]{
  --bg:#f6f7f9;--panel:#ffffff;--raised:#f2f4f7;--hover:#eceff3;--line:#e3e6eb;--line2:#d3d8df;
  --ink:#111418;--ink2:#2c3138;--muted:#5d6570;--faint:#8a929c;
  --accent:#4f46e5;--accent-bg:rgba(79,70,229,.09);--accent-ink:#ffffff;--cyan:#0891b2;
  --ok:#059669;--ok-bg:rgba(5,150,105,.10);--warn:#b45309;--warn-bg:rgba(180,83,9,.08);--bad:#dc2626;--bad-bg:rgba(220,38,38,.08);
  --mark:rgba(251,191,36,.40);--shadow:0 16px 40px rgba(17,20,24,.12);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
button{font:inherit;color:inherit}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
kbd{font:500 11px "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--raised)}

.app{display:flex;flex-direction:column;height:100vh}

/* header */
.hdr{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0;margin-right:auto}
.badge{font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.brand h1{margin:0;font:700 19px/1.2 "Inter",sans-serif;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.modes{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.modes button{border:0;background:none;padding:6px 14px;border-radius:6px;font:600 13px "Inter",sans-serif;color:var(--muted);cursor:pointer}
.modes button[aria-selected=true]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.sync{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{display:flex;flex-direction:column;gap:4px;min-width:128px;margin-right:4px}
.prog b{font:600 13px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.prog b span{color:var(--muted);font-weight:400}
.pbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.saved{display:inline-flex;align-items:center;gap:6px;font:500 11px "JetBrains Mono",monospace;color:var(--muted)}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);transition:box-shadow .3s}
.saved.pulse::before{box-shadow:0 0 0 4px var(--ok-bg)}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--raised);font:500 12.5px "Inter",sans-serif;color:var(--ink2);cursor:pointer}
.ibtn:hover{border-color:var(--line2);color:var(--ink)}
.ibtn svg{width:15px;height:15px;flex:none}
.ibtn.sq{width:32px;padding:0;justify-content:center}

/* workspace */
.ws{flex:1;min-height:0;display:grid;grid-template-columns:minmax(320px,35%) 1fr}
.ws[hidden]{display:none}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.ctl{flex:none;padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:38px;padding:0 60px 0 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:400 14px "Inter",sans-serif}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-bg)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font:500 12.5px "Inter",sans-serif;color:var(--ink2);cursor:pointer}
.pill:hover{border-color:var(--line2)}
.pill .n{font:500 10.5px "JetBrains Mono",monospace;color:var(--faint)}
.pill[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.pill[aria-pressed=true] .n{color:var(--accent)}
.statusseg{display:grid;grid-template-columns:repeat(4,auto);padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.statusseg button{border:0;background:none;padding:5px 6px;border-radius:5px;font:500 12px "Inter",sans-serif;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.statusseg button .n{font:500 10.5px "JetBrains Mono",monospace;color:var(--faint)}
.statusseg button[aria-checked=true]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.frow{display:flex;gap:8px;align-items:center}
.dd{position:relative}
.ddbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:500 12.5px "Inter",sans-serif;color:var(--ink2);cursor:pointer}
.ddbtn.on{border-color:var(--accent);color:var(--ink)}
.ddbtn svg{width:11px;height:11px;color:var(--muted);transition:transform .15s}
.ddbtn[aria-expanded=true] svg{transform:rotate(180deg)}
.ddn{font:600 10.5px "JetBrains Mono",monospace;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center}
.ddn:empty{display:none}
.ddpanel{position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:270px;max-height:min(400px,calc(100vh - 200px));overflow:auto;background:var(--raised);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.ddpanel[hidden]{display:none}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border:0;border-radius:6px;background:none;font:400 13.5px "Inter",sans-serif;color:var(--ink);text-align:left;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--hover)}
.opt .oc{margin-left:auto;font:500 11px "JetBrains Mono",monospace;color:var(--faint)}
.opt .box{width:15px;height:15px;flex:none;border:1.5px solid var(--faint);border-radius:4px;display:grid;place-items:center}
.opt .box.r{border-radius:50%}
.opt[aria-checked=true] .box{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked=true] .box::after{content:"";width:5px;height:5px;border-radius:1px;background:var(--accent-ink)}
.opt[aria-checked=true] .box.r::after{border-radius:50%}
.ddsearch{width:100%;margin:0 0 6px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:400 13px "Inter",sans-serif}
.ddfoot{display:flex;justify-content:flex-end;border-top:1px solid var(--line);margin-top:6px;padding:6px 4px 2px}
.link{background:none;border:0;padding:2px;color:var(--muted);font:500 12px "Inter",sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link:hover{color:var(--ink)}
.cnt{margin-left:auto;font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.active[hidden]{display:none}
.achip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 6px 0 9px;border:1px solid var(--line2);border-radius:999px;background:var(--raised);font:500 11.5px "Inter",sans-serif;color:var(--ink2);cursor:pointer}
.achip span{color:var(--muted);font-size:14px;line-height:1}

.list{flex:1;min-height:0;overflow:auto;padding:4px 8px 16px}
.lh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:baseline;padding:12px 8px 6px;background:var(--panel);font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lh span{font-weight:400;letter-spacing:0}
.qi{display:grid;grid-template-columns:18px 1fr;gap:10px;width:100%;padding:9px 8px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer}
.qi:hover{background:var(--hover)}
.qi[aria-current=true]{background:var(--accent-bg);box-shadow:inset 2px 0 0 var(--accent)}
.qt{font:500 13.5px/1.4 "Inter",sans-serif;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font:500 10.5px "JetBrains Mono",monospace;color:var(--faint)}
.dot{width:14px;height:14px;margin-top:3px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.dot.missed{border-color:var(--bad);background:var(--bad-bg)}
.dot.shaky{border-color:var(--warn);background:var(--warn-bg)}
.dot.solid{border-color:var(--ok);background:var(--ok)}
.dot.solid::after{content:"";width:6px;height:3px;border:solid var(--bg);border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.ref{display:inline-flex;align-items:center;height:16px;padding:0 5px;border:1px solid var(--line2);border-radius:4px;font:500 10px "JetBrains Mono",monospace;color:var(--muted);cursor:help}
.gauge{display:inline-flex;gap:2px;vertical-align:middle}
.gauge u{width:8px;height:4px;border-radius:1px;background:var(--line2);text-decoration:none}
.lvl-fundamental .gauge u:nth-child(-n+1){background:var(--ok)}
.lvl-intermediate .gauge u:nth-child(-n+2){background:var(--warn)}
.lvl-advanced .gauge u:nth-child(-n+3){background:var(--bad)}
.empty{padding:28px 10px;color:var(--muted);font-size:14px}

/* answer pane */
.pane{min-height:0;overflow:auto}
.pin{max-width:860px;margin:0 auto;padding:26px 32px 40px}
.back{display:none;align-items:center;gap:6px;margin:0 0 14px;padding:0;border:0;background:none;color:var(--muted);font:500 13px "Inter",sans-serif;cursor:pointer}
.crumb{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pt{margin:8px 0 10px;font:600 24px/1.3 "Inter",sans-serif;letter-spacing:-.015em;max-width:70ch;text-wrap:pretty}
.pm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border:1px solid var(--line);border-radius:5px;font:500 11px "JetBrains Mono",monospace;color:var(--ink2);background:var(--raised)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tools .sp{flex:1}
.seg{display:inline-flex;padding:2px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:5px;font:500 12.5px "Inter",sans-serif;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-checked=true]{background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.seg.conf button[data-conf=missed][aria-checked=true]{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.seg.conf button[data-conf=shaky][aria-checked=true]{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn)}
.seg.conf button[data-conf=solid][aria-checked=true]{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:500 12.5px "Inter",sans-serif;color:var(--ink2);cursor:pointer}
.tbtn:hover:not(:disabled){border-color:var(--line2);color:var(--ink)}
.tbtn[aria-pressed=true]{border-color:var(--accent);background:var(--accent-bg);color:var(--ink)}
.tbtn svg{width:14px;height:14px}
.recallbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:16px 0 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:13.5px}
.recallbar b{color:var(--ink);font-weight:600}
.cards{display:grid;gap:12px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px}
.card h3{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3 .num{color:var(--faint);letter-spacing:0}
.card p{margin:0 0 10px;max-width:72ch;color:var(--ink2)}
.card p:last-child{margin-bottom:0}
.card ul,.card ol{margin:0;padding-left:20px;max-width:72ch;color:var(--ink2)}
.card li{margin:0 0 8px}
.card li:last-child{margin-bottom:0}
.card.trap{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)}
.card.trap h3{color:var(--warn)}
.trapgrid{display:grid;gap:10px}
.tl{font:600 11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.trapgrid .say{padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--warn) 40%,transparent)}
.trapgrid .say p{color:var(--ink)}
.card.thesis p{font-size:16.5px;line-height:1.55;color:var(--ink);font-weight:500}
.pts li b{display:block;color:var(--ink);font-weight:600}
.fu{border:1px solid var(--line);border-radius:8px;margin:0 0 8px;background:var(--bg)}
.fu summary{cursor:pointer;padding:9px 12px;font-weight:500;color:var(--ink);list-style:none;display:flex;gap:8px}
.fu summary::before{content:"+";font-family:"JetBrains Mono",monospace;color:var(--muted)}
.fu[open] summary::before{content:"−"}
.fu summary::-webkit-details-marker{display:none}
.fu p{margin:0;padding:0 12px 11px 30px}
.card a{color:var(--accent);text-underline-offset:3px}
.hidden-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border-style:dashed;background:transparent}
.hidden-card h3{margin:0}
.revbtn{height:28px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--raised);font:500 12px "Inter",sans-serif;color:var(--ink2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.revbtn svg{width:14px;height:14px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.pnav .mono{font-size:11.5px;color:var(--muted)}
.foot{margin-top:28px;font-size:12px;color:var(--faint);max-width:72ch;line-height:1.5}

/* drill */
.drillws{flex:1;min-height:0;overflow:auto}
.drillws[hidden]{display:none}
.din{max-width:780px;margin:0 auto;padding:26px 24px 40px}
.dtop{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px}
.dstats{margin-left:auto;font:500 11.5px "JetBrains Mono",monospace;color:var(--muted)}
.dscope{font:500 11.5px "JetBrains Mono",monospace;color:var(--faint);margin:0 0 16px}
.dcard{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:24px 26px}
.dkind{font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.dkind.fol{color:var(--cyan)}
.don{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dq{margin:10px 0 8px;font:600 21px/1.35 "Inter",sans-serif;letter-spacing:-.01em}
.dask{margin:0 0 18px;color:var(--muted)}
.dans{margin-top:18px}
.dacts{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--raised);font:600 13px "Inter",sans-serif;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary kbd{color:inherit;border-color:color-mix(in srgb,var(--accent-ink) 40%,transparent);background:transparent}
.btn.miss{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btn.shaky{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
.btn.got{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.dnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px}
.dnav .dstats{margin:0}

@media (min-width:901px){html,body{overflow:hidden}}
@media (max-width:1320px){.brand p{display:none}}
@media (max-width:1100px){.ibtn .lbl{display:none}.ibtn{width:32px;padding:0;justify-content:center}}
@media (max-width:900px){
  .app{height:auto;min-height:100vh}
  .hdr{padding:12px 14px;gap:10px 14px}
  .brand p{display:none}
  .ws{display:block}
  .side{border-right:0}
  .list{overflow:visible}
  .pane{display:none;overflow:visible}
  body.pane-open .side{display:none}
  body.pane-open .pane{display:block}
  .back{display:inline-flex}
  .pin{padding:18px 16px 32px}
  .pt{font-size:21px}
  .hint-desk{display:none!important}
}
@media (max-width:600px){
  .ibtn .lbl{display:none}
  .ibtn{width:32px;padding:0;justify-content:center}
  .sync{width:100%}
  .prog{flex:1}
  .din{padding:18px 14px 32px}
  .dcard{padding:18px 16px}
  .tools .copy-lbl{display:none}
  .saved{font-size:0;gap:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="hdr">
  <div class="brand">
    <span class="badge">Staff-level system design</span>
    <h1>System Design Vault</h1>
    <p>The wrong answer to avoid, what to say instead, and the depth behind it.</p>
  </div>
  <div class="modes" role="tablist" aria-label="Mode">
    <button type="button" role="tab" id="tab-study" aria-selected="true" aria-controls="study">Study index</button>
    <button type="button" role="tab" id="tab-drill" aria-selected="false" aria-controls="drill" tabindex="-1">Trap drill</button>
  </div>
  <div class="sync">
    <div class="prog" aria-live="polite"><b id="mastered"></b><div class="pbar" aria-hidden="true"><i id="mbar"></i></div></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const V=window.VAULT;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const LV={fundamental:"Fundamental",intermediate:"Intermediate",advanced:"Advanced"};
const SHORT={scale:"Scale",data:"Data",caching:"Caching",consistency:"Consistency",reliability:"Reliability",streaming:"Streaming",apis:"APIs",security:"Security",observability:"Observability",infra:"Infra",ai:"AI & LLM",evolution:"Evolution",judgment:"Judgment",domains:"Domains"};
const FOOT="Questions marked “ref list” are titles from a third-party list; every answer outline is written independently. Use outlines as a checklist to build your own answer from, not a script.";
const REF_TIP="Title from a third-party list. The outline is written independently, as a checklist.";
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||"");

/* ---------- data ---------- */
const cats={};V.categories.forEach((c,i)=>{c.pos=i;cats[c.id]=c});
const items=V.questions.map((q,i)=>(q.num=i+1,q));
const byId={};items.forEach(q=>byId[q.id]=q);
const tagCount={};items.forEach(q=>q.tags.forEach(t=>tagCount[t]=(tagCount[t]||0)+1));
const tagsByUse=V.tags.filter(t=>tagCount[t]).sort((a,b)=>tagCount[b]-tagCount[a]||a.localeCompare(b));
const lvlCount={};items.forEach(q=>lvlCount[q.level]=(lvlCount[q.level]||0)+1);
items.forEach(q=>{
  const A=q.answer,parts=[q.q,q.topic,q.also.join(" "),q.a.join(" "),q.tags.join(" "),cats[q.cat].name];
  if(A)parts.push(A.trap?A.trap.wrong+" "+A.trap.why+" "+A.trap.probe+" "+A.trap.say:"",A.thesis,A.pitch,A.decision,A.example||"",A.points.map(p=>p.h+" "+p.d).join(" "),(A.numbers||[]).join(" "),A.pitfalls.join(" "),A.followups.map(f=>f.q+" "+f.a).join(" "));
  q.hay=parts.join(" ").toLowerCase();
});

/* ---------- progress (preserved keys: sdv-done-v2, sdv-drill-v1, sdv-theme; new: sdv-conf-v1, sdv-recall) ---------- */
const KEY="sdv-done-v2",CKEY="sdv-conf-v1",DKEY="sdv-drill-v1";
const parse=k=>{try{return JSON.parse(store(k)||"{}")||{}}catch(e){return{}}};
let done=parse(KEY),conf=parse(CKEY),drill=parse(DKEY);
(function migrate(){const raw=store("sdv-done-v1");if(!raw||store(KEY))return;try{const old=JSON.parse(raw);items.forEach(q=>{if(q.legacy&&q.legacy.some(i=>old[i]))done[q.id]=1});store(KEY,JSON.stringify(done))}catch(e){}})();
function pulse(){const s=$("saved");s.classList.add("pulse");clearTimeout(pulse.t);pulse.t=setTimeout(()=>s.classList.remove("pulse"),700)}
function saveAll(){store(KEY,JSON.stringify(done));store(CKEY,JSON.stringify(conf));store(DKEY,JSON.stringify(drill));pulse()}
const status=id=>conf[id]||(done[id]?"solid":"unseen");
function setConf(id,c){
  if(status(id)===c){delete conf[id];delete done[id]}
  else{conf[id]=c;if(c==="solid")done[id]=1;else delete done[id]}
  saveAll();
}

/* ---------- state + URL ---------- */
const STATUS={all:"All",unseen:"Unseen",review:"Needs review",solid:"Solid"};
const blank=()=>({q:"",cat:"",lvl:"",tags:{},status:"all"});
let st=blank(),sel=null,mode="study",depthMode="full",recall=store("sdv-recall")==="1",revealed=new Set();
function readURL(){
  const p=new URLSearchParams(location.search);
  st.q=(p.get("q")||"").toLowerCase();st.cat=cats[p.get("cat")]?p.get("cat"):"";st.lvl=LV[p.get("lvl")]?p.get("lvl"):"";
  st.tags={};(p.get("tags")||"").split(",").forEach(t=>{if(tagCount[t])st.tags[t]=1});
  st.status=STATUS[p.get("status")]?p.get("status"):(p.get("todo")==="1"?"unseen":"all");
  if(p.get("mode")==="drill")mode="drill";
}
function writeURL(){
  const p=new URLSearchParams();
  if(st.q)p.set("q",st.q);if(st.cat)p.set("cat",st.cat);if(st.lvl)p.set("lvl",st.lvl);
  const t=Object.keys(st.tags);if(t.length)p.set("tags",t.join(","));if(st.status!=="all")p.set("status",st.status);
  if(mode==="drill")p.set("mode","drill");
  const s=p.toString();history.replaceState(null,"",location.pathname+(s?"?"+s:"")+(sel?"#"+sel:""));
}
function statusOk(x){const s=status(x.id);return st.status==="all"||(st.status==="unseen"&&s==="unseen")||(st.status==="solid"&&s==="solid")||(st.status==="review"&&(s==="missed"||s==="shaky"))}
function match(x,ignore){
  if(ignore!=="cat"&&st.cat&&x.cat!==st.cat)return false;
  if(st.lvl&&x.level!==st.lvl)return false;
  for(const g in st.tags)if(!x.tags.includes(g))return false;
  if(ignore!=="status"&&!statusOk(x))return false;
  if(st.q&&x.hay.indexOf(st.q)<0)return false;
  return true;
}
const visible=()=>items.filter(x=>match(x));
function hl(s){const e=esc(s);if(!st.q)return e;const q=esc(st.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return e.replace(new RegExp(q,"gi"),m=>"<mark>"+m+"</mark>")}
const gauge=k=>'<span class="lvl-'+k+'"><span class="gauge" aria-hidden="true"><u></u><u></u><u></u></span></span>';
const pad=n=>String(n).padStart(2,"0");
const cap=s=>s[0].toUpperCase()+s.slice(1);

/* ---------- theme ---------- */
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function themeUI(){const t=document.documentElement.getAttribute("data-theme"),next=t==="dark"?"light":"dark";$("theme").innerHTML=t==="dark"?ICON_SUN:ICON_MOON;$("theme").setAttribute("aria-label","Switch to "+next+" theme");$("theme").title="Switch to "+next+" theme"}
$("theme").onclick=()=>{const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",t);store("sdv-theme",t);themeUI()};
themeUI();

/* ---------- header progress ---------- */
function progress(){const n=items.filter(x=>status(x.id)==="solid").length;$("mastered").innerHTML=n+' <span>/ '+items.length+' mastered</span>';$("mbar").style.width=(n/items.length*100)+"%"}

/* ---------- sidebar controls ---------- */
function drawPills(){
  const base=items.filter(x=>match(x,"cat")).length;
  $("pn-cat").innerHTML=opt('data-cat=""',!st.cat,"All categories",base,true)+V.categories.map(c=>opt('data-cat="'+c.id+'"',st.cat===c.id,esc(c.name),items.filter(x=>x.cat===c.id&&match(x,"cat")).length,true)).join("");
  $("catlbl").textContent=st.cat?(SHORT[st.cat]||cats[st.cat].name):"Category";
  $("dd-cat").classList.toggle("on",!!st.cat);
}
function drawStatus(){
  $("statusseg").innerHTML=Object.keys(STATUS).map(k=>{
    const n=items.filter(x=>{if(!match(x,"status"))return false;const s=status(x.id);return k==="all"||(k==="unseen"&&s==="unseen")||(k==="solid"&&s==="solid")||(k==="review"&&(s==="missed"||s==="shaky"))}).length;
    return'<button type="button" role="radio" data-status="'+k+'" aria-checked="'+(st.status===k)+'" tabindex="'+(st.status===k?0:-1)+'">'+STATUS[k]+'<span class="n">'+n+'</span></button>';
  }).join("");
}
const opt=(attrs,checked,label,count,radio)=>'<button type="button" class="opt" role="menuitem'+(radio?"radio":"checkbox")+'" aria-checked="'+(checked?"true":"false")+'" '+attrs+'><span class="box'+(radio?" r":"")+'"></span>'+label+(count!=null?'<span class="oc">'+count+'</span>':"")+'</button>';
let tagQ="";
$("pn-tags").innerHTML='<input class="ddsearch" id="tagq" type="search" placeholder="Find a tag" aria-label="Find a tag"><div id="taglist"></div><div class="ddfoot"><button type="button" class="link" data-act="cleartags">Clear tags</button></div>';
$("tagq").oninput=e=>{tagQ=e.target.value.toLowerCase();drawDropdowns()};
function drawDropdowns(){
  $("pn-lvl").innerHTML=opt('data-lvl=""',!st.lvl,"All levels",items.length,true)+Object.keys(LV).map(k=>opt('data-lvl="'+k+'"',st.lvl===k,gauge(k)+LV[k],lvlCount[k]||0,true)).join("");
  $("taglist").innerHTML=tagsByUse.filter(g=>!tagQ||g.toLowerCase().includes(tagQ)).map(g=>opt('data-tag="'+esc(g)+'"',!!st.tags[g],esc(g),tagCount[g])).join("")||'<p class="empty" style="padding:8px">No tags match.</p>';
  const nt=Object.keys(st.tags).length;
  $("n-lvl").textContent=st.lvl?"1":"";$("n-tags").textContent=nt||"";
  $("dd-lvl").classList.toggle("on",!!st.lvl);$("dd-tags").classList.toggle("on",nt>0);
  const a=[];
  if(st.cat)a.push(['data-rm="cat"',esc(cats[st.cat].name)]);
  if(st.lvl)a.push(['data-rm="lvl"',LV[st.lvl]]);
  Object.keys(st.tags).forEach(g=>a.push(['data-rm="tag" data-tag="'+esc(g)+'"',esc(g)]));
  const box=$("active"),any=a.length||st.q||st.cat||st.status!=="all";box.hidden=!any;
  box.innerHTML=a.map(c=>'<button type="button" class="achip" '+c[0]+' aria-label="Remove filter '+c[1]+'">'+c[1]+'<span aria-hidden="true">×</span></button>').join("")+'<button type="button" class="link" data-act="clearall">Clear all filters</button>';
}
let openDD=null;
function closeDD(){if(!openDD)return;$("pn-"+openDD).hidden=true;$("dd-"+openDD).setAttribute("aria-expanded","false");openDD=null}
["cat","lvl","tags"].forEach(k=>{
  $("dd-"+k).onclick=e=>{e.stopPropagation();const was=openDD===k;closeDD();if(was)return;openDD=k;$("pn-"+k).hidden=false;$("dd-"+k).setAttribute("aria-expanded","true");const f=k==="tags"?$("tagq"):$("pn-"+k).querySelector(".opt");if(f)f.focus()};
  $("pn-"+k).addEventListener("click",e=>{
    e.stopPropagation();const b=e.target.closest("[data-cat],[data-lvl],[data-tag],[data-act]");if(!b)return;
    if(b.hasAttribute("data-cat")){st.cat=b.getAttribute("data-cat");update();closeDD();$("list").scrollTop=0;$("dd-cat").focus();return}
    if(b.hasAttribute("data-lvl")){st.lvl=b.getAttribute("data-lvl");update();closeDD();$("dd-lvl").focus();return}
    if(b.getAttribute("data-act")==="cleartags"){st.tags={};update();return}
    const g=b.getAttribute("data-tag");if(st.tags[g])delete st.tags[g];else st.tags[g]=1;update();
  });
});
document.addEventListener("click",e=>{if(openDD&&!e.target.closest(".dd"))closeDD()});
$("statusseg").addEventListener("click",e=>{const b=e.target.closest("[data-status]");if(!b)return;st.status=b.dataset.status;update()});
$("statusseg").addEventListener("keydown",e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;e.preventDefault();e.stopPropagation();const ks=Object.keys(STATUS),i=ks.indexOf(st.status);st.status=ks[(i+(e.key==="ArrowRight"?1:ks.length-1))%ks.length];update();$("statusseg").querySelector('[aria-checked="true"]').focus()});
$("active").addEventListener("click",e=>{
  const b=e.target.closest("[data-rm],[data-act]");if(!b)return;
  if(b.getAttribute("data-act")==="clearall"){st=blank();$("q").value="";update();return}
  const r=b.getAttribute("data-rm");if(r==="cat")st.cat="";else if(r==="lvl")st.lvl="";else if(r==="tag")delete st.tags[b.getAttribute("data-tag")];update();
});
let qTimer;
$("q").oninput=e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{st.q=e.target.value.trim().toLowerCase();update()},110)};
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key==="ArrowDown"){const v=visible();if(v.length){e.preventDefault();$("q").blur();select(v[0].id,{scroll:true,open:true})}}});
$("kkey").textContent=isMac?"⌘K":"Ctrl K";

/* ---------- list ---------- */
function rowHTML(x){
  const s=status(x.id);
  return'<button type="button" class="qi" role="option" id="qi-'+x.id+'" data-id="'+x.id+'" aria-selected="'+(x.id===sel)+'"'+(x.id===sel?' aria-current="true"':"")+'>'+
    '<span class="dot '+s+'" title="'+cap(s)+'"><span class="sr">'+cap(s)+'</span></span>'+
    '<span><span class="qt">'+hl(x.q)+'</span><span class="qm">'+gauge(x.level)+'<span>'+esc(SHORT[x.cat])+'</span><span>·</span><span>'+esc(x.topic)+'</span>'+(x.source==="ref"?'<span class="ref" title="'+REF_TIP+'">Ref list</span>':"")+'</span></span></button>';
}
function drawList(){
  const vis=visible();
  $("count").textContent=vis.length+" / "+items.length;
  if(!vis.length){$("list").innerHTML='<div class="empty">No questions match. Clear a filter or shorten the search.</div>';return}
  let h="",last=null;
  vis.forEach(x=>{
    if(!st.cat&&x.cat!==last){h+='<div class="lh" role="presentation">'+esc(cats[x.cat].name)+'<span>'+vis.filter(y=>y.cat===x.cat).length+'</span></div>';last=x.cat}
    h+=rowHTML(x);
  });
  $("list").innerHTML=h;
}

/* ---------- answer pane ---------- */
function trapHTML(t,f){f=f||hl;return'<div class="trapgrid"><div><span class="tl">Tempting answer</span><p>'+f(t.wrong)+'</p></div><div><span class="tl">Why it fails</span><p>'+f(t.why)+'</p></div><div><span class="tl">What they’re probing</span><p>'+f(t.probe)+'</p></div><div class="say"><span class="tl">Say instead</span><p>'+f(t.say)+'</p></div></div>'}
function sections(x){
  const A=x.answer,out=[];
  if(!A)return[{key:"outline",label:"Outline",html:x.a.map(p=>"<p>"+hl(p)+"</p>").join("")}];
  if(A.trap)out.push({key:"trap",label:"The trap",cls:"trap",html:trapHTML(A.trap)});
  out.push({key:"thesis",label:"Opening position",cls:"thesis",html:"<p>"+hl(A.thesis)+"</p>"});
  out.push({key:"pitch",label:"Say it in 60 seconds",html:"<p>"+hl(A.pitch)+"</p>"});
  const quick=depthMode==="quick";
  out.push({key:"points",label:"Key points",html:'<ol class="pts">'+A.points.map(p=>"<li><b>"+hl(p.h)+"</b>"+(quick?"":hl(p.d))+"</li>").join("")+"</ol>"});
  if(quick)return out;
  out.push({key:"decision",label:"When to choose what",html:"<p>"+hl(A.decision)+"</p>"});
  if(A.numbers&&A.numbers.length)out.push({key:"numbers",label:"Numbers",html:"<ul>"+A.numbers.map(n=>"<li>"+hl(n)+"</li>").join("")+"</ul>"});
  out.push({key:"pitfalls",label:"Pitfalls",html:"<ul>"+A.pitfalls.map(n=>"<li>"+hl(n)+"</li>").join("")+"</ul>"});
  out.push({key:"followups",label:"Follow-ups you’ll get",html:'<p style="font-size:13px;color:var(--muted)">Answer each out loud first, then open it.</p>'+A.followups.map(f=>'<details class="fu"><summary>'+hl(f.q)+"</summary><p>"+hl(f.a)+"</p></details>").join("")});
  if(A.example)out.push({key:"example",label:"Example",html:"<p>"+hl(A.example)+"</p>"});
  if(A.deepDive)out.push({key:"deep",label:"Deep dive: "+esc(A.deepDive.title),html:'<ol class="pts">'+A.deepDive.steps.map(p=>"<li><b>"+hl(p.h)+"</b>"+hl(p.d)+"</li>").join("")+"</ol>"});
  if(x.also.length)out.push({key:"also",label:"Also asked as",html:"<ul>"+x.also.map(a=>"<li>"+hl(a)+"</li>").join("")+"</ul>"});
  if(A.related&&A.related.length)out.push({key:"related",label:"Related",html:"<ul>"+A.related.filter(r=>byId[r]).map(r=>'<li><a href="#'+r+'">'+esc(byId[r].q)+"</a></li>").join("")+"</ul>"});
  if(A.sources&&A.sources.length)out.push({key:"sources",label:"Sources",html:"<ul>"+A.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+"</a></li>").join("")+"</ul>"});
  return out;
}
const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function drawPane(){
  const p=$("pane"),vis=visible();
  if(!vis.length){p.innerHTML='<div class="pin"><button type="button" class="back" data-act="back">← Index</button><div class="empty">No questions match these filters.</div><p class="foot">'+FOOT+'</p></div>';return}
  if(!sel||!byId[sel])sel=vis[0].id;
  const x=byId[sel],i=vis.indexOf(x),prev=i>0?vis[i-1]:null,next=i>=0&&i<vis.length-1?vis[i+1]:null,s=status(x.id);
  const secs=sections(x),shown=recall?secs.filter(c=>revealed.has(c.key)).length:secs.length;
  let h='<div class="pin"><button type="button" class="back" data-act="back">← Index</button>'+
    '<div class="crumb"><span>Q'+pad(x.num)+'</span><span>·</span><span>'+esc(cats[x.cat].name)+'</span><span>/</span><span>'+esc(x.topic)+'</span></div>'+
    '<h2 class="pt" id="pt">'+hl(x.q)+'</h2>'+
    '<div class="pm"><span class="tag">'+gauge(x.level)+LV[x.level]+'</span>'+x.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+(x.source==="ref"?'<span class="ref" title="'+REF_TIP+'">Ref list</span>':"")+'</div>'+
    '<div class="tools">'+
      '<div class="seg conf" role="radiogroup" aria-label="Your confidence">'+["missed","shaky","solid"].map((c,k)=>'<button type="button" role="radio" data-conf="'+c+'" aria-checked="'+(s===c)+'" title="'+cap(c)+' (key '+(k+1)+')">'+cap(c)+'</button>').join("")+'</div>'+
      '<button type="button" class="tbtn" data-act="recall" aria-pressed="'+recall+'" title="Hide the outline and test yourself (Space)">'+EYE+(recall?"Testing yourself":"Hide outline (test yourself)")+'</button>'+
      '<span class="sp"></span>'+
      '<div class="seg" role="radiogroup" aria-label="Answer depth">'+["full","quick"].map(d=>'<button type="button" role="radio" data-depth="'+d+'" aria-checked="'+(depthMode===d)+'">'+(d==="full"?"Full":"Quick")+'</button>').join("")+'</div>'+
      '<button type="button" class="tbtn" data-act="copy" aria-label="Copy as Markdown">'+COPY+'<span class="copy-lbl">Copy as Markdown</span></button>'+
    '</div>';
  if(recall)h+='<div class="recallbar"><span><b>Test yourself.</b> Answer out loud, then reveal sections one by one.</span><span class="hint-desk"><kbd>Space</kbd> next section</span><span style="flex:1"></span><span class="mono" style="font-size:11.5px">'+shown+' / '+secs.length+' revealed</span><button type="button" class="revbtn" data-act="revealall">Reveal all</button></div>';
  h+='<div class="cards">'+secs.map((c,k)=>{
    if(recall&&!revealed.has(c.key))return'<section class="card hidden-card" data-key="'+c.key+'"><h3><span class="num">'+pad(k+1)+'</span>'+c.label+'</h3><button type="button" class="revbtn" data-reveal="'+c.key+'">'+EYE+'Reveal</button></section>';
    return'<section class="card '+(c.cls||"")+'" data-key="'+c.key+'"><h3><span class="num">'+pad(k+1)+'</span>'+c.label+'</h3>'+c.html+'</section>';
  }).join("")+'</div>';
  h+='<div class="pnav"><button type="button" class="tbtn" data-go="'+(prev?prev.id:"")+'"'+(prev?"":" disabled")+'><kbd>K</kbd> Previous</button><span class="mono">'+(i>=0?(i+1)+" of "+vis.length:"not in current filter")+'</span><button type="button" class="tbtn" data-go="'+(next?next.id:"")+'"'+(next?"":" disabled")+'>Next <kbd>J</kbd></button></div>';
  h+='<p class="foot">'+FOOT+'</p></div>';
  p.innerHTML=h;
}
function toMarkdown(x){
  const A=x.answer;let m="## "+x.q+"\n\n_"+cats[x.cat].name+" / "+x.topic+" · "+LV[x.level]+" · "+x.tags.join(", ")+"_\n\n";
  if(!A)return m+x.a.map(p=>"- "+p).join("\n")+"\n";
  if(A.trap)m+="### The trap\n- **Tempting answer:** "+A.trap.wrong+"\n- **Why it fails:** "+A.trap.why+"\n- **What they're probing:** "+A.trap.probe+"\n- **Say instead:** "+A.trap.say+"\n\n";
  m+="### Opening position\n"+A.thesis+"\n\n### Say it in 60 seconds\n"+A.pitch+"\n\n### Key points\n"+A.points.map((p,i)=>(i+1)+". **"+p.h+".** "+p.d).join("\n")+"\n\n### When to choose what\n"+A.decision+"\n\n";
  if(A.numbers&&A.numbers.length)m+="### Numbers\n"+A.numbers.map(n=>"- "+n).join("\n")+"\n\n";
  m+="### Pitfalls\n"+A.pitfalls.map(n=>"- "+n).join("\n")+"\n\n### Follow-ups\n"+A.followups.map(f=>"- **"+f.q+"** "+f.a).join("\n")+"\n\n";
  if(A.example)m+="### Example\n"+A.example+"\n\n";
  if(A.sources&&A.sources.length)m+="### Sources\n"+A.sources.map(s=>"- ["+s.title+"]("+s.url+")").join("\n")+"\n";
  return m;
}
const msg=t=>{$("msg").textContent=t};
$("pane").addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-conf],[data-depth],[data-reveal],[data-go]");if(!b)return;
  if(b.dataset.conf){setConf(sel,b.dataset.conf);refreshStatus();return}
  if(b.dataset.depth){if(b.dataset.depth!==depthMode){depthMode=b.dataset.depth;drawPane()}return}
  if(b.dataset.reveal){revealed.add(b.dataset.reveal);drawPane();return}
  if(b.hasAttribute("data-go")){if(b.dataset.go)select(b.dataset.go,{scroll:true});return}
  const a=b.dataset.act;
  if(a==="recall")toggleRecall();
  else if(a==="revealall"){sections(byId[sel]).forEach(c=>revealed.add(c.key));drawPane()}
  else if(a==="back")closePane();
  else if(a==="copy"){const t=toMarkdown(byId[sel]),lbl=b.querySelector("span");const ok=()=>{lbl.textContent="Copied";msg("Copied as Markdown");setTimeout(()=>lbl.textContent="Copy as Markdown",1500)};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,()=>prompt("Copy this Markdown",t));else prompt("Copy this Markdown",t)}
});
$("pane").addEventListener("keydown",e=>{const g=e.target.closest(".seg");if(!g||(e.key!=="ArrowLeft"&&e.key!=="ArrowRight"))return;e.preventDefault();e.stopPropagation();const bs=[...g.querySelectorAll("button")],i=bs.indexOf(e.target),n=bs[(i+(e.key==="ArrowRight"?1:bs.length-1))%bs.length];n.focus()});
function toggleRecall(){recall=!recall;store("sdv-recall",recall?"1":"0");revealed=new Set();drawPane()}
function revealNext(){const ss=sections(byId[sel]),n=ss.find(c=>!revealed.has(c.key));if(!n)return;revealed.add(n.key);drawPane();const el=$("pane").querySelector('[data-key="'+n.key+'"]');if(el)el.scrollIntoView({block:"nearest"})}
function refreshStatus(){progress();drawStatus();drawPills();const r=$("qi-"+sel);if(r){const tmp=document.createElement("div");tmp.innerHTML=rowHTML(byId[sel]);r.replaceWith(tmp.firstChild)}drawPane()}

/* ---------- selection ---------- */
const MOBILE=matchMedia("(max-width:900px)");
function closePane(){document.body.classList.remove("pane-open");const r=$("qi-"+sel);if(r)r.scrollIntoView({block:"center"})}
function select(id,o){
  if(!byId[id])return;o=o||{};
  const old=sel&&$("qi-"+sel);if(old){old.removeAttribute("aria-current");old.setAttribute("aria-selected","false")}
  sel=id;revealed=new Set();
  const r=$("qi-"+id);if(r){r.setAttribute("aria-current","true");r.setAttribute("aria-selected","true");if(o.scroll)r.scrollIntoView({block:"nearest"})}
  drawPane();$("pane").scrollTop=0;
  if(MOBILE.matches&&o.open){document.body.classList.add("pane-open");window.scrollTo(0,0)}
  writeURL();
}
$("list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)select(b.dataset.id,{open:true})});
function move(d){const vis=visible();if(!vis.length)return;let i=vis.indexOf(byId[sel]);i=i<0?0:Math.max(0,Math.min(vis.length-1,i+d));select(vis[i].id,{scroll:true})}
function goTo(id){if(mode!=="study")setMode("study");if(!match(byId[id])){st=blank();$("q").value="";render()}select(id,{scroll:true,open:true})}
window.addEventListener("hashchange",()=>{const id=decodeURIComponent(location.hash.slice(1));if(byId[id]&&id!==sel)goTo(id)});

/* ---------- render ---------- */
function render(){
  const vis=visible();if(sel&&byId[sel]&&!vis.includes(byId[sel])&&vis.length)sel=vis[0].id;
  drawPills();drawStatus();drawDropdowns();drawList();progress();drawPane();
  if(mode==="drill"){drawKinds();renderDrill()}
}
function update(){render();writeURL()}

/* ---------- mode ---------- */
function setMode(m){
  mode=m;const d=m==="drill";
  $("tab-study").setAttribute("aria-selected",String(!d));$("tab-drill").setAttribute("aria-selected",String(d));
  $("tab-study").tabIndex=d?-1:0;$("tab-drill").tabIndex=d?0:-1;
  $("study").hidden=d;$("drill").hidden=!d;
  if(d){dAnyway=false;drawKinds();if(!dCur)nextDrill();else renderDrill()}
  writeURL();
}
$("tab-study").onclick=()=>setMode("study");$("tab-drill").onclick=()=>setMode("drill");
$("tab-study").parentElement.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowRight"){e.preventDefault();e.stopPropagation();setMode(mode==="study"?"drill":"study");$(mode==="study"?"tab-study":"tab-drill").focus()}});

/* ---------- trap drill workspace ---------- */
let dKinds={trap:true,fu:true},dRecent=[],dCur=null,dRevealed=false,dAnyway=false,dHist=[],dHi=-1;
const DAY=864e5;
function drillItems(){const out=[];visible().forEach(x=>{if(!x.answer)return;if(dKinds.trap&&x.answer.trap)out.push({id:x.id+"#trap",x,kind:"trap"});if(dKinds.fu)x.answer.followups.forEach((f,i)=>out.push({id:x.id+"#f"+i,x,kind:"fu",f}))});return out}
function drillStats(pool){const now=Date.now();let due=0,fresh=0,m=0;pool.forEach(it=>{const s=drill[it.id];if(!s)fresh++;else{if(s.due<=now)due++;if(s.r==="got"&&s.streak>=2)m++}});return{due,fresh,m,total:pool.length}}
function pickNext(pool){
  const now=Date.now(),avoid=it=>!dRecent.includes(it.id)||pool.length<=dRecent.length;
  const due=pool.filter(it=>{const s=drill[it.id];return s&&s.due<=now&&avoid(it)}).sort((a,b)=>drill[a.id].due-drill[b.id].due);if(due.length)return due[0];
  const fresh=pool.filter(it=>!drill[it.id]&&avoid(it));if(fresh.length)return fresh[Math.floor(Math.random()*fresh.length)];
  if(dAnyway){const any=pool.filter(avoid);if(any.length)return any[Math.floor(Math.random()*any.length)]}
  return null;
}
function drawKinds(){
  $("dkinds").innerHTML=[["trap","Traps"],["fu","Follow-ups"]].map(p=>'<button type="button" class="pill" data-kind="'+p[0]+'" aria-pressed="'+dKinds[p[0]]+'">'+p[1]+'</button>').join("");
  const parts=[];if(st.cat)parts.push(cats[st.cat].name);if(st.lvl)parts.push(LV[st.lvl]);Object.keys(st.tags).forEach(t=>parts.push(t));if(st.status!=="all")parts.push(STATUS[st.status]);if(st.q)parts.push("“"+st.q+"”");
  $("dscope").textContent=parts.length?"Scope: "+parts.join(" · ")+" (from Study index filters)":"Scope: all categories";
}
$("dkinds").addEventListener("click",e=>{const b=e.target.closest("[data-kind]");if(!b)return;const k=b.dataset.kind;dKinds[k]=!dKinds[k];if(!dKinds.trap&&!dKinds.fu)dKinds[k]=true;drawKinds();dHist=dHist.slice(0,dHi+1);showDrill(pickNext(drillItems()),true)});
function fmtWait(ms){const h=ms/36e5;return h<1?Math.max(1,Math.round(ms/6e4))+" min":h<48?Math.round(h)+" h":Math.round(h/24)+" days"}
function renderDrill(){
  const pool=drillItems(),s=drillStats(pool);
  $("dstats").textContent=s.due+" due · "+s.fresh+" new · "+s.m+" mastered · "+s.total+" in pool";
  $("dfoot").textContent=FOOT;
  $("dprev").disabled=dHi<=0;
  const c=$("dcard");
  if(!dCur){
    const now=Date.now(),nx=pool.map(it=>drill[it.id]&&drill[it.id].due).filter(Boolean).sort((a,b)=>a-b)[0];
    c.innerHTML='<p class="dq">'+(pool.length?"All caught up.":"No prompts match your filters.")+'</p><p class="dask">'+(pool.length?(nx?"Next prompt due in "+fmtWait(nx-now)+". ":"")+"You can keep practising anyway.":"Clear some Study index filters and come back.")+'</p>'+(pool.length?'<div class="dacts"><button type="button" class="btn primary" data-d="anyway">Keep practising</button></div>':"");
    return;
  }
  const it=dCur,x=it.x;let h="";
  if(it.kind==="trap"){
    h+='<div class="dkind">Trap</div><p class="dq">'+esc(x.q)+'</p><p class="dask">What’s the tempting wrong answer here, and what do you say instead? Answer out loud first.</p>';
    if(dRevealed)h+='<div class="dans card trap"><h3>The trap &amp; the reasoning</h3>'+trapHTML(x.answer.trap,esc)+'</div>';
  }else{
    h+='<div class="dkind fol">Follow-up</div><p class="don">On: '+esc(x.q)+'</p><p class="dq">'+esc(it.f.q)+'</p><p class="dask">Answer out loud first, then reveal.</p>';
    if(dRevealed)h+='<div class="dans card"><h3>Answer</h3><p>'+esc(it.f.a)+'</p></div>';
  }
  if(!dRevealed)h+='<div class="dacts"><button type="button" class="btn primary" data-d="reveal">Reveal trap &amp; architectural reasoning <kbd>Space</kbd></button></div>';
  else h+='<div class="dacts"><span class="dstats" style="margin:0 6px 0 0">How did you do?</span><button type="button" class="btn miss" data-d="missed">Missed <kbd>1</kbd></button><button type="button" class="btn shaky" data-d="shaky">Shaky <kbd>2</kbd></button><button type="button" class="btn got" data-d="got">Got it <kbd>3</kbd></button><span style="flex:1"></span><button type="button" class="link" data-d="open">Open full card</button></div>';
  c.innerHTML=h;
}
function showDrill(it,push){dCur=it;dRevealed=false;if(it&&push){dHist=dHist.slice(0,dHi+1);dHist.push(it);dHi=dHist.length-1;dRecent.push(it.id);if(dRecent.length>3)dRecent.shift()}renderDrill()}
function nextDrill(){if(dHi<dHist.length-1){dHi++;dCur=dHist[dHi];dRevealed=false;renderDrill();return}showDrill(pickNext(drillItems()),true)}
function prevDrill(){if(dHi>0){dHi--;dCur=dHist[dHi];dRevealed=false;renderDrill()}}
function rate(r){
  if(!dCur||!dRevealed)return;const s=drill[dCur.id]||{streak:0,seen:0},now=Date.now();
  s.seen++;s.r=r;s.last=now;
  if(r==="missed"){s.streak=0;s.due=now+60e3}else if(r==="shaky"){s.streak=0;s.due=now+DAY}else{s.streak++;s.due=now+Math.min(60,3*Math.pow(2,s.streak-1))*DAY}
  drill[dCur.id]=s;saveAll();dHist=dHist.slice(0,dHi+1);showDrill(pickNext(drillItems()),true);
}
$("dcard").addEventListener("click",e=>{const b=e.target.closest("[data-d]");if(!b)return;const a=b.dataset.d;
  if(a==="reveal"){dRevealed=true;renderDrill()}else if(a==="anyway"){dAnyway=true;nextDrill()}else if(a==="open")goTo(dCur.x.id);else rate(a)});
$("dnext").onclick=nextDrill;$("dprev").onclick=prevDrill;

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const t=e.target,typing=t.matches&&t.matches("input,textarea,select,[contenteditable]");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(mode!=="study")setMode("study");document.body.classList.remove("pane-open");$("q").focus();$("q").select();return}
  if(e.key==="Escape"){if(openDD){const k=openDD;closeDD();$("dd-"+k).focus();return}if(typing){t.blur();return}if(document.body.classList.contains("pane-open"))closePane();return}
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="/"){e.preventDefault();if(mode!=="study")setMode("study");document.body.classList.remove("pane-open");$("q").focus();return}
  const onBtn=t.matches&&t.matches("button,a,summary");
  if(mode==="drill"){
    if(e.key===" "&&!onBtn&&dCur&&!dRevealed){e.preventDefault();dRevealed=true;renderDrill()}
    else if(dRevealed&&["1","2","3"].includes(e.key)){e.preventDefault();rate(e.key==="1"?"missed":e.key==="2"?"shaky":"got")}
    else if(e.key==="ArrowRight"){e.preventDefault();nextDrill()}
    else if(e.key==="ArrowLeft"){e.preventDefault();prevDrill()}
    return;
  }
  if(e.key==="j"||e.key==="ArrowDown"){e.preventDefault();move(1)}
  else if(e.key==="k"||e.key==="ArrowUp"){e.preventDefault();move(-1)}
  else if(e.key===" "&&!onBtn&&sel){e.preventDefault();if(recall&&sections(byId[sel]).some(c=>!revealed.has(c.key)))revealNext();else toggleRecall()}
  else if(["1","2","3"].includes(e.key)&&sel){e.preventDefault();setConf(sel,["missed","shaky","solid"][+e.key-1]);refreshStatus()}
});

/* ---------- export / import / reset ---------- */
$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"staff-design-vault",version:3,exported:new Date().toISOString(),done:Object.keys(done),conf,drill},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="design-vault-progress.json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0);msg("Progress exported");
};
$("import").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    const j=JSON.parse(t),ids=Array.isArray(j.done)?j.done:Object.keys(j.done||{});let n=0;
    ids.forEach(id=>{if(byId[id]&&!done[id]){done[id]=1;n++}});
    if(j.conf&&typeof j.conf==="object")Object.keys(j.conf).forEach(id=>{if(byId[id]&&["missed","shaky","solid"].includes(j.conf[id]))conf[id]=j.conf[id]});
    if(j.drill&&typeof j.drill==="object")Object.keys(j.drill).forEach(k=>{const a=drill[k],b=j.drill[k];if(b&&(!a||(b.last||0)>(a.last||0)))drill[k]=b});
    saveAll();render();msg("Imported progress");alert("Imported progress: "+n+" newly mastered questions.");
  }).catch(()=>alert("That file could not be read."));
  e.target.value="";
};
$("reset").onclick=()=>{if(!confirm("Reset all progress? Confidence ratings, mastered questions and drill history will be cleared from this browser. Export first if you want a backup."))return;done={};conf={};drill={};saveAll();dHist=[];dHi=-1;dCur=null;render();msg("Progress reset")};

/* ---------- boot ---------- */
readURL();$("q").value=st.q;
const h0=decodeURIComponent(location.hash.slice(1));if(byId[h0])sel=h0;
render();
if(mode==="drill")setMode("drill");
if(sel){const r=$("qi-"+sel);if(r)r.scrollIntoView({block:"nearest"});if(MOBILE.matches&&byId[h0])document.body.classList.add("pane-open")}
})();
</script>
</body>
